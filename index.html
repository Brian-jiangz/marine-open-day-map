<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3448">
  <meta name="description" content="2026 海洋科学开放日场馆地图与参观指引">
  <meta property="og:title" content="2026 海洋科学开放日 · 场馆地图">
  <meta property="og:description" content="三栋场馆、全部开放点位与中英文导览">
  <meta property="og:image" content="assets/map/ov_zlq.jpg">
  <title>2026 海洋科学开放日 · 场馆地图</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12"></path>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
      <circle cx="12" cy="10" r="2.5"></circle>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6"></path>
    </symbol>
    <symbol id="i-accessibility" viewBox="0 0 24 24">
      <circle cx="12" cy="4" r="2"></circle>
      <path d="M5 8h14M12 8v5m0 0-3 7m3-7 3 7"></path>
    </symbol>
    <symbol id="i-qr" viewBox="0 0 24 24">
      <rect x="3" y="3" width="6" height="6" rx="1"></rect>
      <rect x="15" y="3" width="6" height="6" rx="1"></rect>
      <rect x="3" y="15" width="6" height="6" rx="1"></rect>
      <path d="M15 15h2v2h-2zM19 15h2v5h-5v2M15 19h3"></path>
    </symbol>
  </svg>

  <header class="topbar">
    <a class="brand-lockup" href="./" aria-label="返回地图首页">
      <span class="brand-mark">MEL</span>
      <span>
        <strong data-i18n="siteTitle">海洋科学开放日</strong>
        <small data-i18n="siteSubtitle">场馆地图与参观指引</small>
      </span>
    </a>
    <span class="topbar-year">2026</span>
  </header>

  <main class="app-shell">
    <section class="hero" id="hero">
      <div class="hero-copy">
        <p class="eyebrow"><span>2026 · 11 · 14</span><span>OPEN DAY</span></p>
        <h1><span data-i18n="heroLead">欢迎来到</span><em>2026</em><strong data-i18n="heroTitle">海洋开放日</strong></h1>
        <p class="hero-sub" data-i18n="heroSub">面向所有来宾的场馆地图与参观指引</p>
      </div>
      <div class="hero-actions" aria-label="显示设置">
        <button class="hero-action lang-action" id="languageButton" type="button">EN</button>
        <button class="hero-action care-action" id="careButton" type="button" aria-pressed="false">
          <span data-care-word="0">关</span>
          <span data-care-word="1">怀</span>
          <span data-care-word="2">版</span>
        </button>
      </div>
    </section>

    <section class="map-controls" aria-label="地图筛选">
      <div class="search-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
          placeholder="搜索编号、名称、楼层或大类" aria-label="搜索点位">
        <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜索">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <div class="building-tabs" id="buildingTabs" role="tablist" aria-label="选择楼栋"></div>
    </section>

    <section class="map-section" id="mapSection">
      <div class="section-heading">
        <div>
          <p class="section-kicker" id="buildingKicker">ZHOU LONGQUAN</p>
          <h2 id="buildingTitle">周隆泉楼</h2>
        </div>
        <p class="point-count" id="pointCount">40 个点位</p>
      </div>

      <div class="map-frame" id="mapFrame" aria-live="polite">
        <div class="map-loading" id="mapLoading">
          <span></span>
          <p data-i18n="loading">地图加载中</p>
        </div>
        <img class="map-image" id="mapImage" alt="周隆泉楼点位地图">
        <div class="map-hotspots" id="mapHotspots"></div>
      </div>
      <div class="map-caption">
        <svg class="icon" aria-hidden="true"><use href="#i-pin"></use></svg>
        <span data-i18n="mapHint">地图上有标记的为活动点位，点击查看介绍</span>
      </div>
    </section>

    <section class="category-section" aria-labelledby="categoryHeading">
      <div class="section-heading compact">
        <div>
          <p class="section-kicker">THEMES</p>
          <h2 id="categoryHeading" data-i18n="categories">篇章大类</h2>
        </div>
        <button class="text-button" id="clearFilter" type="button" hidden data-i18n="showAll">显示全部</button>
      </div>
      <div class="category-chips" id="categoryChips"></div>
      <div class="point-list" id="pointList"></div>
    </section>

    <footer class="site-footer">
      <p class="footer-org" data-i18n="org">海洋科普开放日组委会</p>
      <p data-i18n="credits">开发：姜正 · 柴扉教授课题组</p>
      <p class="footer-meta">2026 OPEN DAY · <a href="qr.html">二维码</a></p>
    </footer>
  </main>

  <dialog class="spot-dialog" id="spotDialog" aria-labelledby="spotTitle">
    <div class="dialog-panel">
      <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭点位详情">
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
      <div class="dialog-head">
        <span class="spot-badge" id="spotBadge">1</span>
        <div>
          <p class="dialog-meta" id="spotMeta"></p>
          <h2 id="spotTitle"></h2>
        </div>
      </div>
      <p class="spot-full" id="spotFull"></p>
      <p class="spot-address" id="spotAddress" hidden></p>
      <p class="spot-intro" id="spotIntro"></p>
      <div class="spot-items" id="spotItems"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>此地图需要启用 JavaScript。</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
