<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8f8">
  <meta name="description" content="2026 海洋科学开放日场馆地图与参观指引">
  <meta property="og:title" content="2026 海洋科学开放日 · 场馆地图">
  <meta property="og:description" content="三栋场馆、全部开放点位与中英文导览">
  <meta property="og:image" content="assets/map/ov_zlq.jpg">
  <title>2026 海洋科学开放日 · 场馆地图</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="3.5" cy="6" r=".6"></circle><circle cx="3.5" cy="12" r=".6"></circle><circle cx="3.5" cy="18" r=".6"></circle></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></symbol>
    <symbol id="i-accessibility" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"></circle><path d="M5 8h14M12 8v5m0 0-3 7m3-7 3 7"></path></symbol>
    <symbol id="i-location" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></symbol>
  </svg>

  <header class="app-header">
    <a class="brand-lockup" href="./" aria-label="地图首页">
      <span class="brand-mark">MEL</span>
      <span class="brand-copy">
        <strong data-i18n="siteTitle">海洋科学开放日</strong>
        <small data-i18n="siteSubtitle">场馆地图与参观指引</small>
      </span>
    </a>
    <div class="header-actions">
      <button class="tool-button lang-button" id="languageButton" type="button">EN</button>
      <button class="tool-button care-button" id="careButton" type="button" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-accessibility"></use></svg>
        <span data-i18n="careShort">关怀</span>
      </button>
    </div>
  </header>

  <main class="map-app">
    <section class="control-deck" aria-label="地图导航">
      <div class="search-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
          placeholder="搜索编号、名称、楼层或大类" aria-label="搜索点位">
        <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜索">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="building-tabs" id="buildingTabs" role="tablist" aria-label="选择楼栋"></div>
    </section>

    <section class="map-workspace">
      <div class="map-viewport" id="mapViewport">
        <div class="map-stage" id="mapStage">
          <img class="map-image" id="mapImage" alt="场馆点位地图">
          <div class="map-hotspots" id="mapHotspots"></div>
        </div>

        <div class="map-title-chip">
          <span class="map-kicker" id="buildingKicker">ZHOU LONGQUAN</span>
          <strong id="buildingTitle">周隆泉楼</strong>
        </div>

        <button class="points-toggle" id="pointsToggle" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg>
          <span data-i18n="points">点位</span>
          <b id="pointCount">40</b>
        </button>

        <div class="zoom-controls" aria-label="地图缩放">
          <button id="zoomIn" type="button" aria-label="放大">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
          <button id="zoomOut" type="button" aria-label="缩小">
            <svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg>
          </button>
          <button id="zoomReset" type="button" aria-label="重置地图">
            <svg class="icon" aria-hidden="true"><use href="#i-reset"></use></svg>
          </button>
          <button id="fullscreenButton" type="button" aria-label="全屏查看">
            <svg class="icon" aria-hidden="true"><use href="#i-expand"></use></svg>
          </button>
        </div>

        <div class="map-status" id="mapStatus" aria-live="polite">
          <span class="status-dot"></span>
          <span data-i18n="mapHint">拖动地图，点击编号查看详情</span>
        </div>
      </div>

      <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="关闭点位列表"></button>

      <aside class="directory-pane" id="directoryPane" aria-labelledby="directoryTitle">
        <div class="directory-head">
          <div>
            <span class="directory-kicker">DIRECTORY</span>
            <h2 id="directoryTitle" data-i18n="directory">点位目录</h2>
          </div>
          <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭点位列表">
            <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </div>
        <div class="directory-summary">
          <span id="directoryCount">40 个点位</span>
          <button class="text-button" id="clearFilter" type="button" hidden data-i18n="showAll">显示全部</button>
        </div>
        <div class="category-chips" id="categoryChips"></div>
        <div class="point-list" id="pointList"></div>
        <footer class="site-footer">
          <strong data-i18n="org">海洋科普开放日组委会</strong>
          <span data-i18n="credits">开发：姜正 · 柴扉教授课题组</span>
          <a href="qr.html" data-i18n="qrCode">二维码</a>
        </footer>
      </aside>
    </section>
  </main>

  <dialog class="spot-dialog" id="spotDialog" aria-labelledby="spotTitle">
    <div class="dialog-panel">
      <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭点位详情">
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
      <div class="dialog-head">
        <span class="spot-badge" id="spotBadge">1</span>
        <div>
          <p class="dialog-meta" id="spotMeta"></p>
          <h2 id="spotTitle"></h2>
        </div>
      </div>
      <p class="spot-full" id="spotFull"></p>
      <p class="spot-address" id="spotAddress" hidden></p>
      <p class="spot-intro" id="spotIntro"></p>
      <div class="spot-items" id="spotItems"></div>
      <button class="focus-button" id="focusButton" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-location"></use></svg>
        <span data-i18n="locate">在地图上定位</span>
      </button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>此地图需要启用 JavaScript。</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
